name: Run Laravel Tests

on:
  push:
    branches:
      - main
      - refactor/start-over-2025
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_sqlite, dom, curl, xml, zip
          coverage: none

      - name: Setup Laravel Environment
        run: |
          echo "Setting up Laravel directories and .env file..."
          # 1. Create the required directories
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/framework/cache
          mkdir -p bootstrap/cache
          # 2. Set broad permissions for the CI environment
          chmod -R 777 storage bootstrap/cache
          # 3. Create the .env file
          cp .env.example .env || echo "APP_ENV=testing" > .env

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Database Migrations
        run: php artisan migrate --force

      - name: Run Unit & Feature Tests
        run: php artisan test
