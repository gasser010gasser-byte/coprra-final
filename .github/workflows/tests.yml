name: Run Laravel Tests

on:
  push:
    branches:
      - main
      - refactor/start-over-2025
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_sqlite, dom, curl, xml, zip
          coverage: none

      - name: Setup Laravel Environment
        run: |
          # 1. Create ALL required directories
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/framework/cache/data
          mkdir -p storage/logs
          mkdir -p bootstrap/cache
          # 2. Set permissions
          chmod -R 777 storage bootstrap/cache
          # 3. Create .env with APP_NAME FIRST (important for cache prefix)
          cat > .env << 'EOL'
          APP_NAME=LaravelTest
          APP_ENV=testing
          APP_KEY=base64:test1234567890123456789012345678901234567890
          APP_DEBUG=true
          APP_URL=http://localhost
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          DB_CONNECTION=sqlite
          DB_DATABASE=:memory:
          EOL

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Generate Application Key
        run: php artisan key:generate --force

      - name: Run Database Migrations
        run: php artisan migrate --force

      - name: Run Unit & Feature Tests
        run: php artisan test
