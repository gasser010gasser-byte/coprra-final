name: Run Laravel Tests

on:
  push:
    branches:
      - main
      - refactor/start-over-2025
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_sqlite, dom, curl, xml, zip
          coverage: none

      - name: Setup Laravel Environment
        run: |
          echo "Setting up Laravel directories and .env file..."
          # 1. Create the required directories
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/framework/cache
          mkdir -p bootstrap/cache
          # 2. Set broad permissions for the CI environment
          chmod -R 777 storage bootstrap/cache
          # 3. Create the .env file with APP_KEY
          cp .env.example .env || echo "APP_ENV=testing" > .env
          # 4. Generate APP_KEY immediately
          php -r "file_put_contents('.env', 'APP_KEY=base64:'.base64_encode(random_bytes(32)).PHP_EOL, FILE_APPEND);"

      - name: Temporarily disable post-autoload-dump script
        run: |
          cp composer.json composer.json.backup
          php -r "\$json = json_decode(file_get_contents('composer.json'), true); if (isset(\$json['scripts']['post-autoload-dump'])) { unset(\$json['scripts']['post-autoload-dump']); file_put_contents('composer.json', json_encode(\$json, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES)); }"

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Restore composer.json
        run: mv composer.json.backup composer.json

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Finalize Composer Setup
        run: php artisan package:discover --ansi

      - name: Run Database Migrations
        run: php artisan migrate --force

      - name: Run Unit & Feature Tests
        run: php artisan test
