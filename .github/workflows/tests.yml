name: Run Laravel Tests

on:
  push:
    branches:
      - main
      - refactor/start-over-2025
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_sqlite, dom, curl, xml, zip
          coverage: none

      - name: Create .env file for CI
        run: |
          echo "APP_NAME=Laravel" > .env
          echo "APP_ENV=testing" >> .env
          echo "APP_KEY=" >> .env
          echo "APP_DEBUG=true" >> .env
          echo "APP_URL=http://localhost" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env
          echo "CACHE_DRIVER=array" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "BCRYPT_ROUNDS=4" >> .env
          echo "MAIL_MAILER=array" >> .env

      - name: Install Composer Dependencies (No Scripts)
        run: composer install --no-interaction --no-progress --no-scripts --no-autoloader

      - name: Generate Autoloader
        run: composer dump-autoload --no-interaction --no-progress

      - name: Run Composer Post-Install Scripts
        run: composer run-script post-install-cmd --no-interaction --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run Unit & Feature Tests
        run: php artisan test
