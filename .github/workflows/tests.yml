name: Run Laravel Tests

on:
  push:
    branches:
      - main
      - refactor/start-over-2025
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # Unified to 8.3
          extensions: mbstring, bcmath, pdo_sqlite, dom, curl, xml, zip
          coverage: none

      - name: Setup Laravel Environment (BEFORE Composer)
        run: |
          # 1. Create ALL required directories FIRST (before composer install)
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/framework/cache/data
          mkdir -p storage/logs
          mkdir -p bootstrap/cache

          # 2. Set permissions
          chmod -R 777 storage bootstrap/cache

          # 3. Create .env file with minimal required configuration
          cat > .env << 'EOF'
          APP_NAME=LaravelTest
          APP_ENV=testing
          APP_KEY=base64:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa=
          APP_DEBUG=true
          APP_URL=http://localhost
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          DB_CONNECTION=sqlite
          DB_DATABASE=:memory:
          EOF

      - name: Install Composer Dependencies (WITHOUT Scripts)
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Generate Autoloader
        run: composer dump-autoload --no-scripts

      - name: Run Package Discovery (MANUALLY)
        run: php artisan package:discover --ansi

      - name: Generate Application Key (Replace Temporary)
        run: php artisan key:generate --force

      - name: Run Database Migrations
        run: php artisan migrate --force

      - name: Run Unit & Feature Tests
        run: vendor/bin/phpunit --configuration phpunit.xml
        env:
          PHPUNIT_TIMEOUT: 1800
