name: Run Laravel Tests

on:
  push:
    branches:
      - main
      - refactor/start-over-2025
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # Unified to 8.3
          extensions: mbstring, bcmath, pdo_sqlite, dom, curl, xml, zip
          coverage: none

      - name: Setup Laravel Environment
        run: |
          # Create .env from .env.example if it exists, otherwise create a minimal one
          if [ -f .env.example ]; then cp .env.example .env; else echo "APP_ENV=testing" > .env; fi
          # Create required directories
          mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache bootstrap/cache
          # Set permissions
          chmod -R 777 storage bootstrap/cache
          # Generate APP_KEY
          php -r "file_put_contents('.env', 'APP_KEY=base64:'.base64_encode(random_bytes(32)).PHP_EOL, FILE_APPEND);"

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run Database Migrations
        run: php artisan migrate --force

      - name: Run Unit & Feature Tests
        run: php artisan test
