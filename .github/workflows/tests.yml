name: Run Laravel Tests

on:
  push:
    branches:
      - refactor/start-over-2025
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Copy .env for testing
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Create required cache directories
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs
          chmod -R 775 bootstrap/cache storage

      - name: Set environment variables and generate APP_KEY
        run: |
          echo "CACHE_DRIVER=array" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          php -r "echo 'APP_KEY=base64:' . base64_encode(random_bytes(32)) . PHP_EOL;" >> .env

      - name: Create temporary bootstrap/app.php stub
        run: |
          mkdir -p bootstrap
          php -r "file_put_contents('bootstrap/app.php', '<?php return new class { public function getCachePath() { return __DIR__ . \"/cache\"; } };');"

      - name: Install Dependencies with no scripts
        env:
          COMPOSER_NO_INTERACTION: 1
        run: composer install --no-progress --prefer-dist --no-scripts --no-autoloader

      - name: Generate autoload files
        run: composer dump-autoload --no-scripts

      - name: Run package discovery
        run: php artisan package:discover --ansi || true

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run Unit & Feature Tests
        run: php artisan test

