
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        user: coprra
        uid: 1000
    container_name: coprra-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - coprra-network

  nginx:
    image: nginx:alpine
    container_name: coprra-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - coprra-network

  db:
    image: mysql:8.0
    container_name: coprra-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - coprra-db-data:/var/lib/mysql
    networks:
      - coprra-network

  redis:
    image: redis:7-alpine
    container_name: coprra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - coprra-redis-data:/data
    networks:
      - coprra-network

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: coprra-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./:/var/www
    networks:
      - coprra-network
    depends_on:
      - redis

networks:
  coprra-network:
    driver: bridge

volumes:
  coprra-db-data:
    driver: local
  coprra-redis-data:
    driver: local
